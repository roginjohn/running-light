<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Running Light – play credits only</title>
  <link rel="icon" href="data:," />
  <meta name="description" content="Running Light: a perya bulb-track game. Play credits only. No real money value." />
  <script type="module" crossorigin src="./assets/index-CHHHhTwh.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BJMb3Ole.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <svg id="defs" width="0" height="0" aria-hidden="true" focusable="false">
        <defs><clipPath id="boardClip"><rect x="24" y="92" width="1260" height="880" rx="22" /></clipPath></defs>
      </svg>
      <svg class="layer" id="L-bg" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <svg class="layer" id="L-top" viewBox="0 0 1920 1080" aria-label="Top bar"></svg>
      <svg class="layer" id="L-frame" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <svg class="layer" id="L-center" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <svg class="layer" id="L-squares" viewBox="0 0 1920 1080" role="group" aria-label="Board: 50 squares, number 1 top-left, clockwise"></svg>
      <svg class="layer nopointer" id="L-light" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <svg class="layer nopointer" id="L-fx" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <svg class="layer" id="L-right" viewBox="0 0 1920 1080" aria-label="Bet controls"></svg>
      <svg class="layer nopointer" id="L-footer" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <svg class="layer nopointer" id="L-tip" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <svg class="layer" id="L-modal" viewBox="0 0 1920 1080"></svg>
      <svg class="layer nopointer" id="L-focus" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <svg class="layer" id="L-loading" viewBox="0 0 1920 1080" aria-label="Loading"></svg>
      <div id="live" class="sr-only" aria-live="polite" role="status"></div>
    </div>
    <div id="enlarge" hidden>
      <div class="logo">Running Light</div>
      <p>Please enlarge window</p>
      <p class="sub">Running Light needs at least 1280 × 720.</p>
    </div>
    <div id="fatal" hidden><p>Running Light could not start. Please reload the page.</p></div>
  </div>
</body>
</html>
