# Assets-only Worker (no script, no routes, no bindings).
# cf-dist is built by .github/workflows/deploy-cloudflare.yml from the gh-pages branch.
# Do not commit cf-dist.
name = "running-light"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./cf-dist"
not_found_handling = "single-page-application"
